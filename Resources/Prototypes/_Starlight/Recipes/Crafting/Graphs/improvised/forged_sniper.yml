- type: constructionGraph
  id: ForgedSniperGraph
  start: start
  graph:
  - node: start
    edges:
    - to: sniper
      steps:
      - tag: ModularBarrel
        icon:
          sprite: _Starlight/Objects/Misc/modular_barrel.rsi
          state: icon
        name: crafting-menu-name-MB
      - anyTags:
        - ModularReceiver
        - ImprovisedModularReceiver
        icon:
          sprite: Objects/Misc/modular_receiver.rsi
          state: icon
        name: construction-graph-tag-modular-receiver
      - tag: RifleStock
        icon:
          sprite: Objects/Misc/rifle_stock.rsi
          state: icon
        name: construction-graph-tag-rifle-stock
      - material: Steel
        amount: 25
        doAfter: 20
      - material: Plasteel
        amount: 15
        doAfter: 25
  - node: sniper
    entity: UnfinishedSniperForged
    edges:
    - to: finished
      steps:
      - tool: Welding
        doAfter: 5
  - node: finished
    entity: WeaponSniperForged
