- type: entity
  id: ActionViewLaws
  name: View Laws
  description: View the laws that you must follow.
  parent: BaseMentalAction
  components:
    - type: Action
      icon:
        sprite: Interface/Actions/actions_borg.rsi
        state: state-laws
      useDelay: 0.5
      itemIconStyle: NoItem
    - type: InstantAction
      event: !type:ToggleLawsScreenEvent

- type: entity
  id: ActionSelectBorgType
  name: Select Cyborg Type
  parent: BaseAction
  components:
    - type: Action
      icon:
        sprite: Interface/Actions/actions_borg.rsi
        state: select-type
      useDelay: 0.5
      itemIconStyle: NoItem
    - type: InstantAction
      event: !type:BorgToggleSelectTypeEvent

