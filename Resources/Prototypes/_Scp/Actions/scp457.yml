- type: entity
  id: Scp457Absorb
  name: Absorb fuel
  description: Absorb all the fuel around you.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: _Scp/Mobs/Scp/scp-457.rsi
      state: fireguy
    itemIconStyle: BigAction
    raiseOnUser: true
  - type: InstantAction
    event: !type:Scp457AbsorbActionEvent
  - type: SafeTimeRestricted

- type: entity
  parent: BaseAction
  id: Scp457Fire
  name: Ignite tile
  description: Ignites the tile you are standing on.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: _Scp/Mobs/Scp/scp-457.rsi
      state: fire
    itemIconStyle: BigAction
    raiseOnUser: true
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: Scp457Flame
      posData: !type:TargetCasterPos
  - type: SafeTimeRestricted
