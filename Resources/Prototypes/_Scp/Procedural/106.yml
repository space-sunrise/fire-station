- type: entity
  parent: WallBrick
  id: WallBrick106
  components:
  - type: RCDDeconstructable
    cost: 666
    delay: 666
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 9999
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseItem
  id: FakeItemScp106
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/SMGs/p90.rsi
    layers:
    - state: base
    - state: mag-5
  - type: TriggerOnGotEquippedHand
  - type: FlashOnTrigger
  - type: DeleteOnTrigger
  - type: KnockdownOnTrigger
    knockdownAmount: 2
    targetUser: true
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Scp/Scp106/laugh.ogg
    positional: true
    targetUser: false
  - type: GuideHelp
    guides:
    - ScpResearch

- type: entity
  parent: BaseStructure
  id: FakeStairsScp106
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: Structures/stairs.rsi
    state: stairs_steel
    drawdepth: FloorObjects
    offset: 0,0.25
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        shape:
          !type:PhysShapeCircle
          radius: 5
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: TriggerOnInteractHand
  - type: KnockdownOnTrigger
    knockdownAmount: 2
    targetUser: true
  - type: DeleteOnTrigger
  - type: RepulseAttractOnTrigger
    speed: 50
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Scp/Scp106/laugh.ogg
    positional: true
    targetUser: false
  - type: GuideHelp
    guides:
    - ScpResearch

