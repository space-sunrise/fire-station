- type: dungeonConfig
  id: BackroomsBase
#  minCount: 2 не работает как мне нужно :(
#  maxCount: 3
  layers:
  - !type:PrefabDunGen
    presets:
    - Tall
    fallbackTile: ScpFloorFlesh106
    roomWhitelist:
      tags:
      - BackroomsMineshaft

#  - !type:CorridorDunGen
#    width: 3
#    tile: ScpFloorFlesh106

  - !type:WormCorridorDunGen
    width: 3
    tile: ScpFloorFlesh106
    maxAngleChange: 0
    count: 1
    length: 3

  - !type:CorridorClutterDunGen
    contents: BackroomsCorridorEntities
    chance: 0.01

  - !type:CorridorClutterDunGen
    contents: BackroomsFloorLights
    chance: 0.01

  - !type:RoomEntranceDunGen
    tile: ScpFloorFlesh106
    contents: BackroomsEntrance

  - !type:EntranceFlankDunGen
    tile: ScpFloorFlesh106
    contents: BackroomsLights

  - !type:WallMountDunGen
    contents: BackroomsWalls
    tile: ScpFloorFlesh106

  - !type:BoundaryWallDunGen
    wall: ScpWallFlesh106
    cornerWall: ScpWallFlesh106
    tile: ScpFloorFlesh106

  - !type:JunctionDunGen
    width: 1
    tile: ScpFloorFlesh106
    contents: BaseAirlockScp

  - !type:AutoCablingDunGen
    entity: CableApcExtension

  - !type:CornerClutterDunGen
    contents: BaseClutter

  - !type:LimitedEntityDunGen
    entity: Scp106Backrooms
    limit: 4

  - !type:LimitedEntityDunGen
    entity: FakeStairsScp106
    limit: 2

  - !type:LimitedEntityDunGen
    entity: StairsUp106

  - !type:LimitedEntityDunGen
    entity: StairsDown106

#  - !type:LimitedEntityDunGen
#    entity: Scp106MonsterFakeOldMan
#    limit: 1

  - !type:LimitedEntityDunGen
    entity: PuddleScp106Reagent200

  - !type:LimitedEntityDunGen
    entity: ScpMobRandomCommandantCorpseSpawner
    limit: 2

  - !type:LimitedEntityDunGen
    entity: ScpMobRandomSPSCorpse
    limit: 2

  - !type:LimitedEntityDunGen
    entity: ScpMobRandomClassDCorpse
    limit: 1

  - !type:MobsDunGen
    minCount: 5
    maxCount: 8
    contents: BackroomsMobs

  # TODO: Add Mobs/Items.
  # For items -> LimitedEntityDunGen
  # For mobs -> MobsDunGen

- type: dungeonConfig
  id: Backrooms
  layers:
  - !type:PrototypeDunGen
