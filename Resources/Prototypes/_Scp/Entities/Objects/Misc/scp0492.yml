
- type: entity
  id: RightHarmArm0492
  name: вредная правая рука
  description: Тёмная стальная рука. При хирургической замене правой руки этим инструментом пациент может больно бить врагов ею.
  suffix: SCP-049-2
  parent: [PartCyber, BaseRightArm]
  components:
    - type: BaseLayerId
      layer: RHarmArm0492
    - type: Sprite
      sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
      state: "icon_harm_arm"
    - type: Icon
      sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
      state: "icon_harm_arm"
    - type: LimbWithItems
      action: ActionScp0492ToggleHarmHandRight
    - type: LimbItemStorage
      items:
        - HarmArmWeapon0492
    - type: Tag
      tags:
      - LimbScp0492

- type: entity
  id: LeftTubeArm0492
  name: трубчатая левая рука
  description: Медная продолговатая труба. При хирургической замене левой руки этим инструментом пациент получает возможность стрелять через трубу отходами своего организма.
  suffix: SCP-049-2
  parent: [PartCyber, BaseLeftArm]
  components:
    - type: BaseLayerId
      layer: LTubeArm0492
    - type: Sprite
      sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
      state: "icon_tube_arm"
    - type: Icon
      sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
      state: "icon_tube_arm"
    - type: LimbWithItems
      action: ActionScp0492ToggleTubeHandLeft
    - type: LimbItemStorage
      items:
        - TubeArmWeapon0492
    - type: Tag
      tags:
      - LimbScp0492

- type: entity
  id: LeftSpringLeg0492
  name: пружинчатая левая нога
  description: Серебрянная большая пружина. При хирургической замене левой ноги этим инструментом пациент начинает быстрее двигаться.
  suffix: SCP-049-2
  parent: [PartCyber, BaseLeftLeg]
  components:
    - type: BaseLayerId
      layer: LSpringLeg0492
    - type: Sprite
      sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
      state: "icon_spring_leg"
    - type: Icon
      sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
      state: "icon_spring_leg"
    - type: MovementBodyPart
      sprintSpeed : 5.825 # +5%
      maxDensity: 111
    - type: Tag
      tags:
      - LimbScp0492

- type: entity
  id: OrganFlashEyes0492
  parent: 
  - BaseItem
  - BaseOrganEyes
  name: глаза на трубках
  description: Две гибкие трубки с колбами на концах. При хирургической замене глаз этим инструментом пациент перестает получать ослепление от вспышек.
  suffix: SCP-049-2
  components:
  - type: Sprite
    sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
    state: "icon_flash_eyes"
  - type: Organ
  - type: Gibbable
  - type: Item
    size: Normal
  - type: FunctionalOrgan
    comps:
    - type: FlashImmunity
  - type: OrganVisualization
    layer: Eyes
    prototype: FlashEyes0492
  - type: Tag
    tags:
    - LimbScp0492

- type: entity
  id: OrganTubeLungs0492
  parent: 
  - BaseItem
  - BaseOrganLungs
  name: насосные лёгкие
  description: Насос из достаточно твёрдой чёрной резины. При хирургической замене лёгких этим инструментом пациент избегает падений и перестает подскальзываться.
  suffix: SCP-049-2
  components:
  - type: Sprite
    sprite: _Scp/Objects/Misc/scp049_limbs/icons.rsi
    state: "icon_tube_lungs"
  - type: Organ
  - type: Gibbable
  - type: Item
    size: Normal
  - type: FunctionalOrgan
    comps:
    - type: NoSlip
  - type: OrganVisualization
    layer: Snout
    prototype: TubeLungs0492
  - type: Tag
    tags:
    - LimbScp0492

- type: entity
  id: OrganLightingRodLiver0492
  parent: 
  - BaseItem
  - BaseOrganLiver
  name: громоотводная печень
  description: Медная компактная часть громоотвода. При хирургической замене печени этим инструментом пациент не сможет поразиться электрическим током.
  suffix: SCP-049-2
  components:
