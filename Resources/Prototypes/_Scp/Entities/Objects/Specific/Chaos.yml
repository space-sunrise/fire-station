# PINPOINTER

- type: entity
  parent: PinpointerStationAlt
  name: chaos pinpointer
  description: A handheld tracking device that leads to the direction of any nearby station.
  id: ChaosPinpointer
  suffix: Station
  components:
  - type: Sprite
    layers:
    - state: pinpointer-chaos
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-chaos
  - type: Pinpointer
    component: BecomesStation
    targetName: the station


# UPLINK

- type: entity
  parent: [BaseItem, BaseChaosContraband]
  id: BaseScpUplinkChaos
  abstract: true
  components:
  - type: Sprite
    sprite: _Scp/Objects/Devices/chaos_uplink.rsi
    layers:
    - state: icon
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    refundAllowed: false
    ownerOnly: true
    balance:
      SupplyPoint: 20
    buySuccessSound:
      path: /Audio/Effects/Arcade/newgame.ogg
  - type: Tag
    tags:
    - ScpChaosUplink
  - type: Item
    shape:
    - 0,0,1,1

- type: entity
  parent: [ BaseScpUplinkChaos, StorePresetScpChaosUplinkLeader]
  id: BaseUplinkChaosLeader
  components:
  - type: Store
    balance:
      SupplyPoint: 20
    buySuccessSound:
      path: /Audio/Effect/Arcade/newgame.ogg

- type: entity
  parent: [ BaseScpUplinkChaos, StorePresetScpChaosUplink]
  id: BaseUplinkChaos
  components:
  - type: Store
    balance:
      SupplyPoint: 20
    buySuccessSound:
      path: /Audio/Effect/Arcade/newgame.ogg
