- type: entity
  id: MagazineACP14
  name: ACP14 magazine
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - MagazineACP14
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: CartridgePistol40SP
    whitelist:
      tags:
      - CartridgePistolDP
    capacity: 10
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Scp/Objects/Weapons/Guns/Ammunition/Magazines/acp14.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
