- type: entity
  id: Oven
  parent: 
  - BaseMachinePowered
  - ConstructibleMachine
  - KitchenElectricGrill
  name: oven
  description: It's a grill and microwave - all in one!
  suffix: Decorative
  components:
  - type: Sprite
    sprite: _Scp/Structures/Machines/oven.rsi
    snapCardinals: true
    layers:
    - state: oven
    - map: ["enum.EntityHeaterVisuals.Setting"]
      shader: unshaded
      visible: false
    - state: unlit
      map: ["enum.MicrowaveVisualizerLayers.BaseUnlit"]
      shader: unshaded
      visible: false
  - type: Microwave
    capacity: 15
    currentCookTimerTime: 10
  - type: ActivatableUI
    key: enum.MicrowaveUiKey.Key
  - type: DeviceLinkSink
    ports:
    - On
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: UserInterface
    interfaces:
      enum.MicrowaveUiKey.Key:
        type: MicrowaveBoundUserInterface
  - type: Physics
  - type: Fixtures
    fixtures:
      itemcollide:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.14,-0.05,0.15,0.25"
        layer:
        - HighImpassable
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.16,0.3,0.16"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    totalIntensity: 5
    intensitySlope: 5
    canCreateVacuum: false
    deleteAfterExplosion: false
  - type: ApcPowerReceiver
    powerLoad: 0
  - type: Machine
    board: OvenMachineCircuitboard
  - type: ContainerContainer
    containers:
      microwave_entity_container: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: EmptyOnMachineDeconstruct
    containers:
    - microwave_entity_container
  - type: GuideHelp
    guides:
    - Chef
    - FoodRecipes
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EntityHeaterVisuals.Setting:
        enum.EntityHeaterVisuals.Setting:
          Off: { visible: false }
          Low: { visible: true, state: low }
          Medium: { visible: true, state: medium }
          High: { visible: true, state: high }
      enum.PowerDeviceVisuals.VisualState:
        enum.MicrowaveVisualizerLayers.BaseUnlit:
          Idle: { visible: false }
          Broken: { visible: false }
          Cooking: { visible: true, state: running_unlit }
