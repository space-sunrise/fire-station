- type: entity
  id: ScpDebugInvisibleGenerator
  parent: BaseGenerator
  suffix: Invisible, DEBUG
  components:
  - type: PowerSupplier
    supplyRate: 300000
    supplyRampRate: 50000
    supplyRampTolerance: 500
  - type: Visibility
    layer: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - GhostImpassable
        layer:
        - GhostImpassable

