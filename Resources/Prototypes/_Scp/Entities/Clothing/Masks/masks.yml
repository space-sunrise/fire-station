- type: entity
  parent: [ ClothingMaskGas, BaseChaosContraband ]
  id: ClothingMaskGasChaosIns
  components:
  - type: Sprite
    sprite: _Scp/Clothing/Mask/gaschaosins.rsi
  - type: Clothing
    sprite: _Scp/Clothing/Mask/gaschaosins.rsi
  - type: FlashImmunity
  - type: Tag
    tags:
    - WhitelistChameleon
    - HamsterWearable
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Snout
    hideOnToggle: true

- type: entity
  parent: ClothingMaskGas
  id: ClothingMaskGasMobileTaskForceMH
  components:
  - type: Sprite
    sprite: _Scp/Clothing/Mask/MTF/mh.rsi
  - type: Clothing
    sprite: _Scp/Clothing/Mask/MTF/mh.rsi
  - type: FlashImmunity
  - type: HideLayerClothing
    slots:
    - Snout
    hideOnToggle: true

- type: entity
  parent: ClothingMaskPullableBase
  id: ClothingMaskScp933Tape
  name: duct tape strip
  description: Sticky strips cinched the face tight. You are barely visible and barely heard.
  components:
  - type: Sprite
    sprite: _Scp/Objects/Scp/scp-933.rsi
    layers:
    - state: peel
      map: [ "mask" ]
  - type: Clothing
    sprite: _Scp/Objects/Scp/scp-933.rsi
    equippedState: equipped
  - type: Mask
    enabled: false
  - type: Scp933TapeMask
    applyDelaySeconds: 2.5
    ripDelaySeconds: 2.5
    applyToFaceSound:
      path: /Audio/_Scp/Scp933/ducttape.ogg
    ripFromFaceSound:
      path: /Audio/_Scp/Scp933/peeloff.ogg
  - type: HideLayerClothing
    slots:
    - Snout
    hideOnToggle: false
  - type: Blindfold
  - type: Construction
    graph: Blindfold
    node: blindfold
  - type: FlashImmunity
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.80
  - type: Item
    size: Small
