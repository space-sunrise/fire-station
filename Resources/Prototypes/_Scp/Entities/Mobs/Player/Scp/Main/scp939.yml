- type: entity
  id: Scp939
  suffix: SCP-939
  parent:
  - BaseScp
  - MobCombat
  - MobAtmosStandard
  - MobBloodstream
  - InventoryBase
  components:
  - type: AutoGhostRole
    disconnectDelay: 600
    pollDuration: 900
    transferDelay: 180
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Scp/Mobs/Scp/scp-939.rsi
    layers:
    - map: [ "base" ]
      state: alive
  - type: GenericVisualizer
    visuals:
      enum.MobStateVisuals.State:
        base:
          Dead: { state: dead }
          Critical: { state: dead }
          Alive: { state: alive }
      enum.ScpHealOnSleepVisuals.Sleeping:
        base:
          True: { state: asleep }
  - type: ActiveListener
    range: 20
  - type: Scp
    class: Keter
  - type: Scp939
  - type: ScpOnSoundVisibilityViewer
    poorEyesOnFlash: true
    onFlashMessage: scp939-flashed
    protections:
      components:
      - Scp939Protection
  - type: ScpHealOnSleep
    actionProto: Scp939SleepAction
    hibernationHealingRate:
      types:
        Blunt: -20
        Slash: -20
        Piercing: -20
        Heat: -20
        Shock: -20
        Bloodloss: -20
        Genetic: -20
        Toxin: -20
        Airloss: -20
        Asphyxiation: -20
        Poison: -20
        Radiation: -20
        Cellular: -20
    hibernationStates:
    - Critical
  - type: ScpRememberPhrase
    actionProto: Scp939MimicAction
  - type: ScpTriggerOnActionListener
  - type: SmokeOnTrigger
    keysIn:
    - scpSmokeTrigger
    solution:
      reagents:
        - ReagentId: АМН-С227
          Quantity: 40
    spreadAmount: 10
    smokePrototype: АМН-С227Smoke
  - type: ScpMaskChecker
  - type: ActionGrant
    actions:
    - Scp939SmokeAction
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      collection: HitScp939
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 20
        Slash: 20
        Structural: 80
    range: 2
  - type: BloodSplatterer
    amount: 2, 6
    distance: 2, 25
    probability: 1
    bloodLineProbability: 0.4
    pierceLevel: HardenedMetal
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4
  - type: SlowOnDamage
    speedModifierThresholds:
      1000: 0.9
      1100: 0.8
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
  - type: Inventory
    templateId: scp939
  - type: ToggleableNightVision
    effect: ScpEffectNightVisionScp939
  - type: ScpAnnounceOnSpawn
    text: scp939-announce-on-spawn
    channels:
    - ScientificService
    - HeavyContainmentSecurityService
  - type: Puller
    needsHands: false
  - type: Pullable
  - type: Buckle
  - type: FlashImmunity
    enabled: false # переопределение родитесколько иммунитета
  - type: Muted
  - type: Strippable
  - type: Stripping
  - type: ScpPossibilities
    canEjectPilotFromMech: false
    openContainer: false
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: FootprintEmitter
    leftBareFootState:
    - footprint-left-bare-lizard
    rightBareFootState:
    - footprint-right-bare-lizard
  - type: TTS
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepScp939
  - type: EmitSoundRandomly
    sound:
      collection: IdleScp939
      params:
        maxDistance: 6
  - type: KillGlobalSound
    sound:
      collection: DistanceKillScp939
    originWhitelist:
      components:
      - Scp939
  - type: ScpExaminableDamage
    mode: MobToCritical
    generalMessages: ScpScp939Messages
    departmentMessages:
      HeavyContainmentSecurityService: ScpScp939SecurityMessages
      ExternalAdministrativeZoneSecurityService: ScpScp939SecurityMessages
    jobMessages:
      SecurityCommander: ScpScp939SecurityMessages
  - type: GuideHelp
    guides:
    - ScpResearch
    - ScpFear
