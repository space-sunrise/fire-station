- type: entity
  parent:
  - BaseSimpleMob
  - MobAtmosExposed
  - MobCombat
  - MobBloodstream
  id: BaseMobScp106Monster
  name: ???
  abstract: true
  suffix: SCP-106 mob
  components:
  - type: ToggleableNightVision
    effect: ScpEffectNightVision
  - type: Body
    prototype: Animal
  - type: Climbing
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: FleshMob
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
      - SCPs
  - type: Tag
    tags:
      - DoorBumpOpener
      - CannotSuicide
      - FootstepSound
  - type: Sprite
    drawdepth: Mobs
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 5
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: Appearance
  - type: Butcherable
    spawned:
      - id: FoodMeat
        amount: 1
  - type: CombatMode
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Structural: 20
  - type: Scp
    class: Keter

- type: entity
  parent: BaseMobScp106Monster
  id: Scp106MonsterRespirator
  components:
  - type: Sprite
    sprite: _Scp/Mobs/Scp106Servants/respirator.rsi
    state: icon
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: GuideHelp
    guides:
    - ScpFear
  - type: HTN
    constantlyReplan: true
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      VisionRadius: !type:Single
        12
      AggroVisionRadius: !type:Single
        12
      FollowRange: !type:Single
        4
      MeleeRange: !type:Single
        4
  - type: InputMover
  - type: MobMover
  - type: MovementSpeedModifier # убегает от игрока
    baseWalkSpeed: -6
    baseSprintSpeed: -6
  - type: JumpAbility
    jumpThrowSpeed: 100
    jumpDistance: -8
    jumpSound: /Audio/_Scp/Scp035/Equip/sound2.ogg
  - type: NPCUseActionWhenTargetInRange
    actions:
    - actionId: ActionGravityJump
      minRange: 0
      maxRange: 2.5
  - type: AmbientSound
    enabled: true
    volume: -5
    range: 6
    sound:
      path: /Audio/_Scp/Scp106/breath.ogg
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: StandingState
  - type: ScpRestriction
    canStandingState: true
  - type: Butcherable
    spawned:
      - id: ClothingMaskGasSwat
        amount: 1
      - id: Scp106Cloth
        amount: 1
  - type: MeleeWeapon
    damage:
      types:
        Slash: 35
        Structural: 20

