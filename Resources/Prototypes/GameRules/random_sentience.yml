- type: entity
  id: RandomSentience
  parent: BaseGameRule
  components:
  - type: StationEvent
    weight: 6
    duration: 1
    maxOccurrences: 1 # this event has diminishing returns on interesting-ness, so we cap it
#    startAudio: Fire edit
#      path: /Audio/Announcements/attention.ogg
  - type: RandomSentienceRule
    minSentiences: 2
    maxSentiences: 5

- type: localizedDataset
  id: RandomSentienceEventData
  values:
    prefix: scp-random-sentience-event-data- # Fire edit
    count: 6

- type: localizedDataset
  id: RandomSentienceEventStrength
  values:
    prefix: scp-random-sentience-event-strength- # Fire edit
    count: 8
