- type: interaction
  id: FaceCheeksPull
  name: interaction-name-face-cheeks-pull
  category: Face
  icon: FaceCheeksPullIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "щёки", "рот" ]
    requireExposed: true
  interactionMessages:
  - "%user gently caresses %target's cheeks"
  - "%user gently stretches %target's cheeks"
  - "%user squeezes %target's cheeks"
  cooldown: 1

- type: interaction
  id: FacePats
  name: interaction-name-face-pats
  category: Face
  icon: FacePatsIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "лицо" ]
    requireExposed: true
  interactionMessages:
  - "%user gently runs a palm over %target's face"
  - "%user affectionately strokes %target's face with a palm"
  - "%user lightly caresses %target's face with a palm"
  interactionSounds:
  - FacePatsSound
  cooldown: 3

- type: interaction
  id: FaceLickDoggyStyle
  name: interaction-name-face-lick-doggy-style
  category: Face
  icon: FaceLickDoggyStyleIcon
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: true
    checkTarget: false
    categories: [ "рот" ]
    requireExposed: true
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "лицо" ]
    requireExposed: true
  - !type:SpeciesCondition
    checkTarget: false
    checkInitiator: true
    allowedSpecies: [ Vulpkanin, Felinid ]
  interactionMessages:
  - "%user licks %target's cheeks like a dog"
  - "%user licks %target's face like a dog"
  - "%user licks %target's nose like a dog"
  interactionSounds:
  - FaceLickDoggyStyleSound1
  - FaceLickDoggyStyleSound2
  cooldown: 3
