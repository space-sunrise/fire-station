    allowSelfTargeting: false
  - !type:BodyAreaTagCondition
    checkInitiator: true
    checkTarget: false
    categories: [ "лицо"]
    requireExposed: true
  - !type:BodyAreaTagCondition
    checkInitiator: false
    checkTarget: true
    categories: [ "шея"]
    requireExposed: true
  cooldown: 3
