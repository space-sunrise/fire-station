- type: interaction
  id: NeckNuzzle
  name: interaction-name-neck-nuzzle
  icon: FriendlyHandshakeIcon # TODO новый спрайт
  category: Neck
  interactionMessages:
  - "%user gently rubs their muzzle against %target's neck."
  - "%user softly touches %target's neck with their muzzle, creating a pleasant sensation."
  appearConditions:
