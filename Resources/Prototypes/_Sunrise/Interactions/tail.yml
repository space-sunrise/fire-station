- type: interaction
  id: PatTail
  name: interaction-name-pat-tail
  icon: FriendlyPatTailIcon
  category: Tail
  interactionMessages:
  - "%user gently strokes %target's tail."
  - "%user affectionately runs a hand along %target's tail."
  - "%user playfully strokes %target's tail."
  appearConditions:
  - !type:HasTargetCondition
    allowSelfTargeting: false
  - !type:HasVisualLayerCondition
    checkTarget: true
    checkInitiator: false
    layer: Tail
  - !type:InteractionNotCondition
    condition: !type:SpeciesCondition
      checkInitiator: false
      checkTarget: true
      allowedSpecies: [ Moth, Milira ]
  cooldown: 3
